                                                            key={av.id}
                                                            onClick={() => { setSelectedAvatar(av.id); setEditCustomAvatar(''); }}
                                                            className={`w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition-all ${
                                                                !editCustomAvatar && selectedAvatar === av.id ? 'btn-func-gradient scale-110' : 'unified-course-card opacity-75 hover:opacity-100'
                                                            }`}
                                                        >
                                                            {av.iconText ? av.iconText : <i className={`fa-solid ${av.icon}`}></i>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-[11px] font-bold uppercase mb-1">
                                                        {translateEnToVi ? "Tên Hiển Thị:" : "Display Name:"}
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={editName}
                                                        onChange={(e) => setEditName(e.target.value)}
                                                        className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none font-mono-code"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold uppercase mb-1">
                                                        {translateEnToVi ? "Mục Tiêu Rank:" : "Target Rank Goal:"}
                                                    </label>
                                                    <select
                                                        value={editTargetRank}
                                                        onChange={(e) => setEditTargetRank(e.target.value)}
                                                        className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none font-mono-code"
                                                    >
                                                        {TIERS.map(t => (
                                                            <option key={t.en} value={t.vi}>{translateEnToVi ? `Hạng ${t.vi} (${t.min} XP)` : `${t.en} Rank (${t.min} XP)`}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-[11px] font-bold uppercase mb-1">
                                                        {translateEnToVi ? "Giới Thiệu Ngắn / Chuyên Ngành:" : "Short Bio / Specialty:"}
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={editBio}
                                                        onChange={(e) => setEditBio(e.target.value)}
                                                        placeholder="C++20 · Competitive Programming"
                                                        className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold uppercase mb-1">
                                                        {translateEnToVi ? "Liên Kết GitHub / Portfolio:" : "GitHub / Portfolio URL:"}
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={editGithub}
                                                        onChange={(e) => setEditGithub(e.target.value)}
                                                        placeholder="https://github.com/username"
                                                        className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none font-mono-code"
                                                    />
                                                </div>
                                            </div>

                                            <button
                                                type="button"
                                                onClick={handleSaveProfile}
                                                className="btn-func-gradient w-full py-3 rounded-xl text-xs"
                                            >
                                                <i className="fa-solid fa-floppy-disk mr-1.5"></i>
                                                {translateEnToVi ? "Lưu Hồ Sơ & Ảnh Đại Diện" : "Save Profile & Avatar"}
                                            </button>
                                        </div>
                                    )}

                                    {profileModalTab === 'security' && (
                                        <form onSubmit={handleUpdatePasswordInAccount} className="space-y-4 text-xs">
                                            <div className="surface-elevated p-4 rounded-2xl space-y-2">
                                                <div className="flex justify-between">
                                                    <span className="opacity-75">{translateEnToVi ? 'Tài khoản định danh:' : 'Account Identifier:'}</span>
                                                    <span className="font-mono-code font-bold">{authUser?.email}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="opacity-75">{translateEnToVi ? 'Phương thức xác thực:' : 'Auth Provider:'}</span>
                                                    <span className="font-mono-code uppercase font-bold" style={{ color: 'var(--brand-accent)' }}>{authUser?.provider || 'email'}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="opacity-75">{translateEnToVi ? 'Phân quyền hệ thống:' : 'System Role:'}</span>
                                                    <span className="font-mono-code uppercase font-bold" style={{ color: 'var(--brand-primary)' }}>
                                                        {isAdmin ? 'ROOT ADMIN (nguyentanhaihuy2008cm@gmail.com)' : 'STUDENT'}
                                                    </span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[11px] font-bold uppercase mb-1">
                                                    {translateEnToVi ? 'Mật Khẩu Mới (Tối thiểu 6 ký tự, có chữ & số):' : 'New Password (Min 6 chars, letters & digits):'}
                                                </label>
                                                <input
                                                    type="password"
                                                    required
                                                    value={newAccountPassword}
                                                    onChange={e => setNewAccountPassword(e.target.value)}
                                                    placeholder="••••••••"
                                                    className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none font-mono-code"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-[11px] font-bold uppercase mb-1">
                                                    {translateEnToVi ? 'Xác Nhận Mật Khẩu Mới:' : 'Confirm New Password:'}
                                                </label>
                                                <input
                                                    type="password"
                                                    required
                                                    value={confirmAccountPassword}
                                                    onChange={e => setConfirmAccountPassword(e.target.value)}
                                                    placeholder="••••••••"
                                                    className="w-full surface-elevated rounded-xl p-2.5 text-xs focus:outline-none font-mono-code"
                                                />
                                            </div>

                                            {accountMsg && (
                                                <div className="text-xs font-bold" style={{ color: 'var(--brand-accent)' }}>{accountMsg}</div>
                                            )}

                                            <button type="submit" className="btn-func-gradient w-full py-3 rounded-xl text-xs">
                                                <i className="fa-solid fa-key mr-1.5"></i>
                                                {translateEnToVi ? 'Cập Nhật Mật Khẩu' : 'Update Password'}
                                            </button>
                                        </form>
                                    )}

                                    {profileModalTab === 'data' && (
                                        <div className="space-y-4 text-xs">
                                            <div className="grid grid-cols-3 gap-2.5 text-center">
                                                <div className="surface-elevated p-3.5 rounded-2xl">
                                                    <div className="text-[10px] opacity-70 uppercase">{translateEnToVi ? 'Điểm XP' : 'Total XP'}</div>
                                                    <div className="text-lg font-black font-mono-code mt-1" style={{ color: 'var(--brand-primary)' }}>{totalXP}</div>
                                                </div>
                                                <div className="surface-elevated p-3.5 rounded-2xl">
                                                    <div className="text-[10px] opacity-70 uppercase">{translateEnToVi ? 'Bài Đã Giải' : 'Solved'}</div>
                                                    <div className="text-lg font-black font-mono-code mt-1" style={{ color: 'var(--brand-accent)' }}>{Object.keys(solved).length}</div>
                                                </div>
                                                <div className="surface-elevated p-3.5 rounded-2xl">
                                                    <div className="text-[10px] opacity-70 uppercase">{translateEnToVi ? 'Hạng BXH' : 'Standing'}</div>
                                                    <div className="text-lg font-black font-mono-code mt-1">
                                                        #{Math.max(1, leaderboardEntries.findIndex(e => e.email === authUser?.email?.toLowerCase()) + 1)}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="surface-elevated p-4 rounded-2xl space-y-2.5">
                                                <div className="font-bold uppercase text-[11px]">
                                                    {translateEnToVi ? 'Sao Lưu & Khôi Phục Hồ Sơ Học Tập:' : 'Backup & Restore Study Progress:'}
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                                    <button
                                                        type="button"
                                                        onClick={handleExportProgress}
                                                        className="btn-func-gradient py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2"
                                                    >
                                                        <i className="fa-solid fa-cloud-arrow-down"></i>
                                                        <span>{translateEnToVi ? 'Tải File Sao Lưu (.json)' : 'Export Backup (.json)'}</span>
                                                    </button>
                                                    <label className="btn-solid-secondary py-2.5 px-3 rounded-xl text-xs cursor-pointer flex items-center justify-center gap-2">
                                                        <i className="fa-solid fa-file-import" style={{ color: 'var(--brand-accent)' }}></i>
                                                        <span>{translateEnToVi ? 'Khôi Phục Từ File' : 'Import Backup'}</span>
                                                        <input type="file" accept=".json" onChange={handleImportBackupJson} className="hidden" />
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* MODAL TÌM KIẾM NHANH CTRL+K */}
                        {showCommandModal && (
                            <div
                                onClick={() => setShowCommandModal(false)}
                                className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-start justify-center pt-20 p-4 z-[70]"
                            >
                                <div
                                    onClick={e => e.stopPropagation()}
                                    className="unified-course-card max-w-xl w-full rounded-2xl overflow-hidden"
                                >
                                    <div className="flex items-center gap-3 px-4 py-3.5 border-b" style={{ borderColor: 'var(--border-color)' }}>
                                        <i className="fa-solid fa-magnifying-glass" style={{ color: 'var(--brand-primary)' }}></i>
                                        <input
                                            type="text"
                                            autoFocus
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            placeholder={translateEnToVi ? 'Tìm nhanh chương học, bài học C++...' : 'Search chapters, C++ topics...'}
                                            className="w-full bg-transparent text-xs focus:outline-none"
                                        />
                                        <button type="button" onClick={() => setShowCommandModal(false)} className="text-xs opacity-60 hover:opacity-100">ESC</button>
                                    </div>
                                    <div className="max-h-80 overflow-y-auto p-2 space-y-1">
                                        {ROADMAP_RANKS.flatMap(p =>
                                            p.knowledgeChapters.flatMap(ch =>
                                                ch.topics.map(tp => ({
                                                    phase: p.phase,
                                                    chapTitle: translateEnToVi ? ch.chapterTitle : ch.chapterTitleEn,
                                                    topicObj: tp,
                                                    label: translateEnToVi ? tp.topicVi : tp.topic
                                                }))
                                            )
                                        )
                                            .filter(item => !searchQuery.trim() || item.label.toLowerCase().includes(searchQuery.toLowerCase()))
                                            .slice(0, 12)
                                            .map((item, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => {
                                                        setActiveDomain('laptrinh');
                                                        setActiveTab('roadmap');
                                                        setSelectedPhase(item.phase);
                                                        setReadingDoc(item.topicObj);
                                                        setShowCommandModal(false);
                                                    }}
                                                    className="w-full text-left px-3.5 py-2.5 rounded-xl hover:opacity-90 surface-elevated flex items-center justify-between gap-2 transition"
                                                >
                                                    <div>
                                                        <div className="text-xs font-bold">{item.label}</div>
                                                        <div className="text-[10px] opacity-65">Phase {item.phase} · {item.chapTitle}</div>
                                                    </div>
                                                    <i className="fa-solid fa-arrow-right text-xs" style={{ color: 'var(--brand-accent)' }}></i>
                                                </button>
                                            ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL BẢNG TÓM TẮT C++ & BIG-O */}
                        {showCheatsheetModal && (
                            <div
                                onClick={() => setShowCheatsheetModal(false)}
                                className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-[70]"
                            >
                                <div
                                    onClick={e => e.stopPropagation()}
                                    className="unified-course-card max-w-2xl w-full p-6 rounded-2xl space-y-4 max-h-[85vh] overflow-y-auto"
                                >
                                    <div className="flex justify-between items-center border-b pb-3" style={{ borderColor: 'var(--border-color)' }}>
                                        <h3 className="text-base font-black flex items-center gap-2" style={{ color: 'var(--brand-primary)' }}>
                                            <i className="fa-solid fa-bolt" style={{ color: 'var(--brand-accent)' }}></i>
                                            {translateEnToVi ? 'Bảng Tóm Tắt Nhanh C++ STL & Độ Phức Tập Big-O' : 'C++ STL & Big-O Quick Cheat Sheet'}
                                        </h3>
                                        <button type="button" onClick={() => setShowCheatsheetModal(false)} className="opacity-70 hover:opacity-100">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-mono-code">
                                        <div className="surface-elevated p-3.5 rounded-xl space-y-1">
                                            <div className="font-bold" style={{ color: 'var(--brand-accent)' }}>std::vector&lt;T&gt;</div>
                                            <div>push_back / pop_back: O(1)</div>
                                            <div>Random access v[i]: O(1)</div>
                                            <div>std::sort(v.begin(), v.end()): O(N log N)</div>
                                        </div>
                                        <div className="surface-elevated p-3.5 rounded-xl space-y-1">
                                            <div className="font-bold" style={{ color: 'var(--brand-primary)' }}>std::unordered_map&lt;K, V&gt;</div>
                                            <div>Average insert / find: O(1)</div>
                                            <div>Worst-case collision: O(N)</div>
                                        </div>
                                        <div className="surface-elevated p-3.5 rounded-xl space-y-1">
                                            <div className="font-bold" style={{ color: 'var(--brand-primary)' }}>std::map / std::set (Red-Black Tree)</div>
                                            <div>insert / erase / find: O(log N)</div>
                                            <div>lower_bound / upper_bound: O(log N)</div>
                                        </div>
                                        <div className="surface-elevated p-3.5 rounded-xl space-y-1">
                                            <div className="font-bold" style={{ color: 'var(--brand-accent)' }}>Heap Memory &amp; Pointers</div>
                                            <div>int *p = new int[n];</div>
                                            <div>delete[] p; p = nullptr;</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="border-t py-4 text-center text-[11px] opacity-75 font-mono-code" style={{ backgroundColor: 'var(--header-bg)', borderColor: 'var(--border-color)' }}>
                        <div className="max-w-6xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2">
                            <span className="inline-flex items-center gap-2">
                                <GeminiStarIcon size={22} />
                                <span>&lt;C++&gt; CODER RISING · 1-YEAR FREELANCE ROADMAP</span>
                            </span>
                            <span>SOLID TRI-COLOR EDITION · ZERO-DRIFT IDE</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
