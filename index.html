    <!-- React & ReactDOM -->

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style id="core-theme-styles">
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            box-sizing: border-box;
            forced-color-adjust: none;
            -webkit-print-color-adjust: exact;
        }

        .font-editorial {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            letter-spacing: -0.015em;
            line-height: 1.35;
        }

        .font-mono-code,
        .font-mono-code * {
            font-family: 'Fira Code', monospace !important;
            tab-size: 4;
            font-variant-ligatures: none !important;
        }

        /* ==================== HỆ THỐNG 2 BỘ 3 MÀU ĐƠN SẮC (SOLID TRI-COLOR SYSTEM) ==================== */
        /* BỘ 1: CHẾ ĐỘ TỐI (DARK MODE - DÙNG MÀU KIM LOẠI BÃO HÒA CAO, KHÔNG DÙNG MÀU TRẮNG TRONG BACKGROUND-IMAGE ĐỂ CHỐNG CỐC CỐC BÔI ĐEN) */
        :root,
        html.dark-theme,
        body.dark-theme,
        .dark-theme,
        .dark-theme.theme-vi,
        .dark-theme .theme-vi,
        .theme-vi {
            color-scheme: dark;
            --bg-base: #090A0F;
            --surface-solid: #11131C;
            --surface-elevated: #171A26;
            --brand-primary: #F43F5E;
            --brand-accent: #F59E0B;
            --chrome-fg: #E2E8F0;
            --btn-grad: linear-gradient(135deg, #E11D48 0%, #F43F5E 52%, #F59E0B 100%);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --card-bg: #11131C;
            --header-bg: #090A0F;
            --border-color: #272A3A;
            --accent-glow: rgba(244, 63, 94, 0.35);
            --mint-glow: rgba(245, 158, 11, 0.3);
            --text-blur-bg: rgba(17, 19, 28, 0.82);
            --grad-cpp: linear-gradient(135deg, #FB7185 0%, #F43F5E 26%, #E11D48 50%, #F59E0B 76%, #FB7185 100%);
            --shadow-cpp: drop-shadow(0 2px 0 #9f1239) drop-shadow(0 5px 0 #881337) drop-shadow(0 12px 26px rgba(244, 63, 94, 0.55));
            --grad-metal-primary: linear-gradient(135deg, #FB7185 0%, #F43F5E 35%, #E11D48 68%, #FB7185 100%);
            --grad-metal-accent: linear-gradient(135deg, #FBBF24 0%, #F59E0B 40%, #D97706 72%, #FBBF24 100%);
            --grad-static-primary: linear-gradient(165deg, #FB7185 0%, #F43F5E 50%, #E11D48 100%);
            --grad-static-accent: linear-gradient(165deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            --metal-shadow: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
        }

        .dark-theme.theme-en,
        .dark-theme .theme-en,
        .theme-en {
            color-scheme: dark;
            --bg-base: #080C14;
            --surface-solid: #101726;
            --surface-elevated: #172136;
            --brand-primary: #3B82F6;
            --brand-accent: #06B6D4;
            --chrome-fg: #E2E8F0;
            --btn-grad: linear-gradient(135deg, #2563EB 0%, #3B82F6 50%, #06B6D4 100%);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --card-bg: #101726;
            --header-bg: #080C14;
            --border-color: #1E293B;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --mint-glow: rgba(6, 182, 212, 0.3);
            --text-blur-bg: rgba(16, 23, 38, 0.82);
            --grad-cpp: linear-gradient(135deg, #60A5FA 0%, #3B82F6 28%, #2563EB 54%, #06B6D4 80%, #60A5FA 100%);
            --shadow-cpp: drop-shadow(0 2px 0 #1d4ed8) drop-shadow(0 5px 0 #1e3a8a) drop-shadow(0 12px 24px rgba(59, 130, 246, 0.55));
            --grad-metal-primary: linear-gradient(135deg, #60A5FA 0%, #3B82F6 40%, #2563EB 75%, #60A5FA 100%);
            --grad-metal-accent: linear-gradient(135deg, #22D3EE 0%, #06B6D4 40%, #0891B2 75%, #22D3EE 100%);
            --grad-static-primary: linear-gradient(165deg, #60A5FA 0%, #3B82F6 50%, #2563EB 100%);
            --grad-static-accent: linear-gradient(165deg, #22D3EE 0%, #06B6D4 50%, #0891B2 100%);
            --metal-shadow: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
        }

        /* BỘ 2: CHẾ ĐỘ SÁNG (LIGHT MODE - TƯƠNG PHẢN CAO, ĐỒNG BỘ 100% TRÊN MỌI TRÌNH DUYỆT WEB) */
        html.light-theme,
        body.light-theme,
        .light-theme,
        html.light-theme .theme-vi,
        body.light-theme .theme-vi,
        .light-theme.theme-vi,
        .light-theme .theme-vi {
            color-scheme: light;
            --bg-base: #F7F5F0;
            --surface-solid: #FFFFFF;
            --surface-elevated: #EFECE6;
            --brand-primary: #BE123C;
            --brand-accent: #B45309;
            --chrome-fg: #1E293B;
            --btn-grad: linear-gradient(135deg, #9F1239 0%, #E11D48 52%, #D97706 100%);
            --text-main: #0F172A;
            --text-muted: #475569;
            --card-bg: #FFFFFF;
            --header-bg: #FFFFFF;
            --border-color: #DCD3C2;
            --accent-glow: rgba(190, 18, 60, 0.18);
            --mint-glow: rgba(180, 83, 9, 0.16);
            --text-blur-bg: rgba(255, 255, 255, 0.88);
            --grad-cpp: linear-gradient(125deg, #9f1239 0%, #e11d48 35%, #be123c 68%, #9f1239 100%);
            --shadow-cpp: drop-shadow(0 2px 0 #fecdd3) drop-shadow(0 4px 0 #fda4af) drop-shadow(0 10px 18px rgba(159, 18, 57, 0.28));
            --grad-metal-primary: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #9f1239 100%);
            --grad-metal-accent: linear-gradient(135deg, #b45309 0%, #d97706 50%, #92400e 100%);
            --grad-static-primary: linear-gradient(165deg, #be123c 0%, #e11d48 55%, #9f1239 100%);
            --grad-static-accent: linear-gradient(165deg, #b45309 0%, #d97706 55%, #92400e 100%);
            --metal-shadow: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.12));
        }

        html.light-theme .theme-en,
        body.light-theme .theme-en,
        .light-theme.theme-en,
        .light-theme .theme-en {
            color-scheme: light;
            --bg-base: #EFF6FF;
            --surface-solid: #FFFFFF;
            --surface-elevated: #E0F2FE;
            --brand-primary: #1D4ED8;
            --brand-accent: #0284C7;
            --chrome-fg: #1E293B;
            --btn-grad: linear-gradient(135deg, #1E40AF 0%, #2563EB 50%, #0284C7 100%);
            --text-main: #0F172A;
            --text-muted: #334155;
            --card-bg: #FFFFFF;
            --header-bg: #FFFFFF;
            --border-color: #BFDBFE;
            --accent-glow: rgba(29, 78, 216, 0.18);
            --mint-glow: rgba(2, 132, 199, 0.18);
            --text-blur-bg: rgba(255, 255, 255, 0.88);
            --grad-cpp: linear-gradient(125deg, #1e40af 0%, #2563eb 40%, #1d4ed8 72%, #1e3a8a 100%);
            --shadow-cpp: drop-shadow(0 2px 0 #bfdbfe) drop-shadow(0 4px 0 #93c5fd) drop-shadow(0 10px 18px rgba(30, 58, 138, 0.28));
            --grad-metal-primary: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #1e40af 100%);
            --grad-metal-accent: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #0369a1 100%);
            --grad-static-primary: linear-gradient(165deg, #1d4ed8 0%, #2563eb 55%, #1e40af 100%);
            --grad-static-accent: linear-gradient(165deg, #0284c7 0%, #0ea5e9 55%, #0369a1 100%);
            --metal-shadow: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.12));
        }

        /* Lớp làm mờ cục bộ ngay dưới vùng có chữ để tránh rối mắt bởi hiệu ứng nền */
        .text-blur-shield {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.82) 0%, var(--text-blur-bg) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            box-shadow:
                0 18px 32px -8px rgba(0, 0, 0, 0.72),
                0 6px 12px -2px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
                inset 0 -2px 0 0 rgba(0, 0, 0, 0.4);
        }

        .text-blur-aura {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.78) 0%, var(--text-blur-bg) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            box-shadow:
                0 28px 55px -12px rgba(0, 0, 0, 0.75),
                0 10px 20px -5px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
                inset 0 -3px 6px 0 rgba(0, 0, 0, 0.45);
        }

        .text-blur-circle {
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06) 0%, var(--text-blur-bg) 56%, rgba(5, 7, 12, 0.96) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 9999px;
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 24px 50px -12px rgba(0, 0, 0, 0.9),
                inset 0 0 38px -6px var(--accent-glow),
                inset 0 2px 3px 0 rgba(255, 255, 255, 0.2),
                inset 0 -16px 32px 0 rgba(0, 0, 0, 0.75);
        }

        .light-theme .text-blur-shield,
        body.light-theme .text-blur-shield {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(241, 245, 249, 0.92) 100%) !important;
            border: 1px solid var(--border-color) !important;
            color: #0F172A !important;
            box-shadow:
                0 14px 26px -8px rgba(15, 23, 42, 0.14),
                0 4px 10px -2px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 0 #FFFFFF,
                inset 0 -2px 0 0 rgba(148, 163, 184, 0.28) !important;
        }

        .light-theme .text-blur-aura,
        body.light-theme .text-blur-aura {
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 250, 252, 0.92) 100%) !important;
            border: 1px solid var(--border-color) !important;
            color: #0F172A !important;
            box-shadow:
                0 22px 44px -12px rgba(15, 23, 42, 0.14),
                0 8px 18px -4px rgba(15, 23, 42, 0.06),
                inset 0 1px 0 0 #FFFFFF,
                inset 0 -3px 6px 0 rgba(148, 163, 184, 0.22) !important;
        }

        .light-theme .text-blur-circle,
        body.light-theme .text-blur-circle {
            background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, rgba(248, 250, 252, 0.95) 62%, rgba(226, 232, 240, 0.9) 100%) !important;
            border: 1.5px solid var(--border-color) !important;
            box-shadow:
                0 28px 60px -15px rgba(15, 23, 42, 0.18),
                inset 0 0 32px -6px var(--accent-glow),
                inset 0 3px 6px 0 #FFFFFF,
                inset 0 -14px 28px 0 rgba(148, 163, 184, 0.28) !important;
        }

        body {
            margin: 0;
            background-color: var(--bg-base) !important;
            color: var(--text-main) !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            background-color: var(--bg-base) !important;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 55%),
                radial-gradient(circle at 15% 85%, var(--accent-glow) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, var(--mint-glow) 0%, transparent 45%);
            color: var(--text-main) !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Thẻ bề mặt có độ dày 3D, ánh sáng hắt đỉnh (Top Specular Highlight) & Đổ bóng đa tầng */
        .glass-panel,
        .unified-course-card {
            background-color: var(--surface-solid) !important;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, 0.25) 100%) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            box-shadow:
                0 20px 38px -12px rgba(0, 0, 0, 0.65),
                0 6px 14px -4px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
                inset 0 -2px 0 0 rgba(0, 0, 0, 0.45);
            transition: border-color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, background-color 0.35s ease;
        }

        .light-theme .glass-panel,
        .light-theme .unified-course-card,
        body.light-theme .glass-panel,
        body.light-theme .unified-course-card {
            background-color: #FFFFFF !important;
            background-image: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%) !important;
            color: #0F172A !important;
            box-shadow:
                0 18px 36px -10px rgba(15, 23, 42, 0.12),
                0 4px 12px -2px rgba(15, 23, 42, 0.06),
                inset 0 1px 0 0 #FFFFFF,
                inset 0 -2px 0 0 rgba(203, 213, 225, 0.7) !important;
        }

        .unified-course-card:hover {
            border-color: var(--brand-accent) !important;
            transform: translateY(-3px);
            box-shadow:
                0 26px 48px -12px rgba(0, 0, 0, 0.75),
                0 0 24px -6px var(--mint-glow),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
                inset 0 -2px 0 0 rgba(0, 0, 0, 0.5);
        }

        .light-theme .unified-course-card:hover,
        body.light-theme .unified-course-card:hover {
            box-shadow:
                0 24px 44px -10px rgba(15, 23, 42, 0.18),
                0 0 20px -4px var(--mint-glow),
                inset 0 1px 0 0 #FFFFFF,
                inset 0 -2px 0 0 rgba(148, 163, 184, 0.5) !important;
        }

        /* Hốc lõm / Khung lồng bên trong */
        .surface-elevated {
            background-color: var(--surface-elevated) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            box-shadow:
                inset 0 2px 6px 0 rgba(0, 0, 0, 0.45),
                0 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        .light-theme .surface-elevated,
        body.light-theme .surface-elevated {
            background-color: var(--surface-elevated) !important;
            color: #0F172A !important;
            box-shadow:
                inset 0 2px 5px 0 rgba(15, 23, 42, 0.06),
                0 1px 0 0 #FFFFFF !important;
        }

        /* CHỈ PHÍM CHỨC NĂNG CHÍNH MỚI DÙNG GRADIENT + ĐỘ DÀY NÚT BẤM 3D */
        .btn-func-gradient {
            background-image: var(--btn-grad) !important;
            color: #FFFFFF !important;
            font-weight: 800;
            border: none !important;
            box-shadow:
                0 10px 22px -5px var(--accent-glow),
                0 4px 8px -2px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.38),
                inset 0 -3px 0 0 rgba(0, 0, 0, 0.32);
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-func-gradient:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 28px -4px var(--accent-glow),
                0 6px 12px -2px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.45),
                inset 0 -3px 0 0 rgba(0, 0, 0, 0.35);
        }

        .btn-func-gradient:active {
            transform: translateY(1px);
        }

        .btn-solid-secondary {
            background-color: var(--surface-elevated) !important;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(0, 0, 0, 0.2) 100%) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            font-weight: 700;
            box-shadow:
                0 6px 14px -4px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
                inset 0 -2px 0 0 rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .light-theme .btn-solid-secondary,
        body.light-theme .btn-solid-secondary {
            background-color: #FFFFFF !important;
            background-image: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%) !important;
            color: #0F172A !important;
            box-shadow:
                0 4px 10px -2px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 0 #FFFFFF,
                inset 0 -2px 0 0 rgba(203, 213, 225, 0.8) !important;
        }

        .btn-solid-secondary:hover {
            border-color: var(--brand-primary) !important;
            transform: translateY(-1px);
        }

        /* Đồng bộ Light Mode rõ nét cho Header, Sidebar & Khung mẫu I/O */
        .light-theme header,
        .light-theme aside,
        .light-theme footer,
        body.light-theme header,
        body.light-theme aside,
        body.light-theme footer {
            background-color: #FFFFFF !important;
            border-color: var(--border-color) !important;
            color: #0F172A !important;
        }

        .sample-io-box {
            background-color: #090D16;
            color: #6EE7B7;
            border: 1px solid #1E293B;
        }

        .light-theme .sample-io-box,
        body.light-theme .sample-io-box {
            background-color: #F8FAFC !important;
            color: #047857 !important;
            border: 1px solid #CBD5E1 !important;
        }

        /* Chế độ Sáng cho IDE: Nền trắng tinh khiết, viền rõ nét, chữ & màu từ khóa tương phản cao */
        .light-theme .ide-dark-keep,
        body.light-theme .ide-dark-keep {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            border-color: #CBD5E1 !important;
            box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.08) !important;
        }

        .light-theme .ide-dark-keep .bg-slate-950,
        body.light-theme .ide-dark-keep .bg-slate-950 {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
        }

        .light-theme .ide-dark-keep .bg-slate-900,
        .light-theme .ide-dark-keep .bg-slate-900\/95,
        .light-theme .ide-dark-keep .bg-slate-900\/90,

            { word: "map", cat: "stl" }, { word: "unordered_map", cat: "stl" }, { word: "set", cat: "stl" },
            { word: "pair", cat: "stl" }, { word: "sort", cat: "stl" }, { word: "swap", cat: "stl" },
            { word: "getline", cat: "stl" }, { word: "strlen", cat: "stl" }, { word: "strcmp", cat: "stl" },
            { word: "strcpy", cat: "stl" }, { word: "max", cat: "stl" }, { word: "min", cat: "stl" },
            { word: "sqrt", cat: "stl" }, { word: "abs", cat: "stl" }
        ];

        const CAT_BADGE = {
            type: { label: "type", cls: "text-rose-400 bg-rose-500/10 border-rose-500/30" },
            flow: { label: "flow", cls: "text-sky-400 bg-sky-500/10 border-sky-500/30" },
            stl:  { label: "stl",  cls: "text-emerald-400 bg-emerald-500/10 border-emerald-500/30" },
            mem:  { label: "mem",  cls: "text-orange-400 bg-orange-500/10 border-orange-500/30" },
            prep: { label: "#prep", cls: "text-purple-400 bg-purple-500/10 border-purple-500/30" }
        };

        const ProfessionalIDE = ({ value, onChange, placeholder, isVi, initial }) => {
            const ta = useRef(null), preRef = useRef(null), gut = useRef(null);
            const [cur, setCur] = useState({ ln: 1, col: 1 });
            const [fs, setFs] = useState(13);
            const [copied, setCopied] = useState(false);
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionIndex, setActiveSuggestionIndex] = useState(0);
            const [runOutput, setRunOutput] = useState(null);
            const [isRunning, setIsRunning] = useState(false);
            const [customInput, setCustomInput] = useState("5\n10 20 30 40 50");
            const [showStdin, setShowStdin] = useState(false);

            const code = value || '';
            const nLines = code.split('\n').length;
            const vi = isVi;

            const upd = () => {
                const t = ta.current;
                if (!t) return;
                const b = t.value.slice(0, t.selectionStart).split('\n');
                setCur({ ln: b.length, col: b[b.length - 1].length + 1 });

                const textBeforeCursor = t.value.substring(0, t.selectionStart);
                const currentWordMatch = textBeforeCursor.match(/[a-zA-Z_][a-zA-Z0-9_:]*$/);
                if (currentWordMatch && currentWordMatch[0].length >= 1) {
                    const query = currentWordMatch[0].toLowerCase();
                    const matched = CPLUSPLUS_KEYWORDS.filter(
                        item => item.word.toLowerCase().startsWith(query) && item.word !== currentWordMatch[0]
                    ).slice(0, 8);
                    setSuggestions(matched);
                    setActiveSuggestionIndex(0);
                } else {
                    setSuggestions([]);
                }
            };

            const sync = () => {
                const t = ta.current;
                if (!t) return;
                if (gut.current) gut.current.scrollTop = t.scrollTop;
                if (preRef.current) {
                    preRef.current.scrollTop = t.scrollTop;
                    preRef.current.scrollLeft = t.scrollLeft;
                }
            };

            const edit = (v, s, e = s) => {
                onChange(v);
                setTimeout(() => {
                    if (ta.current) {
                        ta.current.setSelectionRange(s, e);
                        upd();
                        sync();
                    }
                }, 0);
            };

            const insertKeyword = (item) => {
                const keyword = typeof item === 'string' ? item : item.word;
                const t = ta.current;
                if (!t) return;
                const cursorIdx = t.selectionStart;
                const textBeforeCursor = code.substring(0, cursorIdx);
                const currentWordMatch = textBeforeCursor.match(/[a-zA-Z_][a-zA-Z0-9_:]*$/);
                const wordLength = currentWordMatch ? currentWordMatch[0].length : 0;

                const newValue = code.substring(0, cursorIdx - wordLength) + keyword + code.substring(cursorIdx);
                onChange(newValue);
                setSuggestions([]);
                setTimeout(() => {
                    t.selectionStart = t.selectionEnd = cursorIdx - wordLength + keyword.length;
                    t.focus();
                    upd();
                    sync();
                }, 0);
            };

            const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };

            const onKey = (e) => {
                const t = ta.current, v = t.value, s = t.selectionStart, en = t.selectionEnd, k = e.key;
                const ls = v.lastIndexOf('\n', s - 1) + 1;

                if (suggestions.length > 0) {
                    if (k === 'ArrowDown') {
                        e.preventDefault();
                        setActiveSuggestionIndex(prev => (prev + 1) % suggestions.length);
                        return;
                    }
                    if (k === 'ArrowUp') {
                        e.preventDefault();
                        setActiveSuggestionIndex(prev => (prev - 1 + suggestions.length) % suggestions.length);
                        return;
                    }
                    if (k === 'Enter' || k === 'Tab') {
                        if (suggestions[activeSuggestionIndex]) {
                            e.preventDefault();
                            insertKeyword(suggestions[activeSuggestionIndex]);
                            return;
                        }
                    }
                    if (k === 'Escape') {
                        setSuggestions([]);
                        return;
                    }
                }

                if (k === 'Tab') {
                    e.preventDefault();
                    if (s !== en || e.shiftKey) {
                        const block = v.slice(ls, en), lines = block.split('\n');
                        const out = lines.map(l => e.shiftKey ? l.replace(/^( {1,4}|\t)/, '') : '    ' + l);
                        const joined = out.join('\n');
                        edit(v.slice(0, ls) + joined + v.slice(en), Math.max(ls, s + out[0].length - lines[0].length), en + joined.length - block.length);
                    } else edit(v.slice(0, s) + '    ' + v.slice(en), s + 4);
                    return;
                }

                if (k === 'Enter' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    const line = v.slice(ls, s), ind = line.match(/^\s*/)[0];
                    const open = /[{(\[]\s*$/.test(line), nx = v[en];
                    if (open && (nx === '}' || nx === ')' || nx === ']')) {
                        edit(v.slice(0, s) + '\n' + ind + '    \n' + ind + v.slice(en), s + 5 + ind.length);
                    } else {
                        const ins = '\n' + ind + (open ? '    ' : '');
                        edit(v.slice(0, s) + ins + v.slice(en), s + ins.length);
                    }
                    return;
                }

                if ((e.ctrlKey || e.metaKey) && k === '/') {
                    e.preventDefault();
                    let be = v.indexOf('\n', en);
                    if (be < 0) be = v.length;
                    const lines = v.slice(ls, be).split('\n');
                    const all = lines.every(l => !l.trim() || /^\s*\/\//.test(l));
                    const out = lines.map(l => all ? l.replace(/^(\s*)\/\/ ?/, '$1') : l.replace(/^(\s*)/, '$1// ')).join('\n');
                    edit(v.slice(0, ls) + out + v.slice(be), ls, ls + out.length);
                    return;
                }

                if (PAIRS[k] && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const close = PAIRS[k];
                    if (s !== en) {
                        e.preventDefault();
                        edit(v.slice(0, s) + k + v.slice(s, en) + close + v.slice(en), s + 1, en + 1);
                        return;
                    }
                    if (k === '"' || k === "'") {
                        if (v[s] === k) {
                            e.preventDefault();
                            t.setSelectionRange(s + 1, s + 1);
                            return;
                        }
                        if (/\w/.test(v[s - 1] || '')) return;
                    }
                    e.preventDefault();
                    edit(v.slice(0, s) + k + close + v.slice(s), s + 1);
                    return;
                }
                if ((k === ')' || k === ']' || k === '}') && s === en && v[s] === k) {
                    e.preventDefault();
                    t.setSelectionRange(s + 1, s + 1);
                    return;
                }
                if (k === 'Backspace' && s === en && s > 0 && PAIRS[v[s - 1]] === v[s]) {
                    e.preventDefault();
                    edit(v.slice(0, s - 1) + v.slice(s + 1), s - 1);
                }
            };

            const handleRunCode = () => {
                setIsRunning(true);
                setRunOutput(null);
                setTimeout(() => {
                    setIsRunning(false);
                    const trimmed = code.trim();
                    if (!trimmed) {
                        setRunOutput({ status: 'err', text: vi ? "Lỗi: Mã nguồn trống!" : "Error: Empty source code!" });
                        return;
                    }
                    const openBraces = (code.match(/\{/g) || []).length;
                    const closeBraces = (code.match(/\}/g) || []).length;
                    if (openBraces !== closeBraces) {
                        setRunOutput({
                            status: 'err',
                            text: vi
                                ? `main.cpp: Lỗi biên dịch: Ngoặc nhọn '{' (${openBraces}) và '}' (${closeBraces}) không khớp nhau.`
                                : `main.cpp: Compilation Error: Unmatched braces '{' (${openBraces}) vs '}' (${closeBraces}).`
                        });
                        return;
                    }
                    const coutMatches = [...code.matchAll(/cout\s*<<\s*([^;]+);/g)];
                    let simulatedStdout = "";
                    if (coutMatches.length > 0) {
                        simulatedStdout = coutMatches.map(m => {
                            const expr = m[1];
                            const strLiterals = [...expr.matchAll(/"([^"]*)"/g)].map(s => s[1]);
                            return strLiterals.length > 0 ? strLiterals.join('') : "[Evaluated Expression]";
                        }).join('\n');
                    } else if (/return\s+/.test(code)) {
                        simulatedStdout = vi
                            ? "Hàm thực thi thành công với bộ test mẫu.\nGiá trị trả về hợp lệ."
                            : "Function executed successfully against sample testbench.\nReturn value verified.";
                    } else {
                        simulatedStdout = vi ? "(Chương trình kết thúc với mã 0)" : "(Program exited with code 0)";
                    }

                    const execTime = (Math.random() * 4 + 1.2).toFixed(2);
                    const memUsed = Math.floor(Math.random() * 240 + 1280);
                    setRunOutput({
                        status: 'ok',
                        time: execTime,
                        mem: memUsed,
                        stdin: customInput,
                        text: simulatedStdout
                    });
                }, 420);
            };

            const copy = () => {
                try {
                    const temp = document.createElement('textarea');
                    temp.value = code;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                } catch (e) {}
            };

            const btn = "px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition text-[11px]";

            return (
                <div className="ide-dark-keep rounded-2xl border border-slate-800 bg-slate-950 overflow-hidden shadow-2xl relative">
                    <div className="flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-slate-900 border-b border-slate-800 text-[10px] text-slate-400">
                        <div className="flex items-center gap-2">
                            <span className="flex gap-1.5">
                                <i className="w-2.5 h-2.5 rounded-full bg-rose-500"></i>
                                <i className="w-2.5 h-2.5 rounded-full bg-amber-400"></i>
                                <i className="w-2.5 h-2.5 rounded-full bg-emerald-500"></i>
                            </span>
                            <span className="font-mono-code font-bold text-slate-200 ml-1">main.cpp</span>
                            <span className="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">
                                GCC C++20
                            </span>
                        </div>
                        <div className="flex flex-wrap items-center gap-1.5">
                            <button
                                type="button"
                                onClick={() => setShowStdin(s => !s)}
                                className={btn}
                            >
                                <i className="fa-solid fa-terminal mr-1"></i>Stdin
                            </button>
                            <button
                                type="button"
                                onClick={handleRunCode}
                                className="btn-func-gradient px-3 py-1 rounded-lg flex items-center gap-1.5 text-[11px]"
                            >
                                <i className={`fa-solid ${isRunning ? 'fa-spinner fa-spin' : 'fa-play'}`}></i>
                                {vi ? 'Chạy thử' : 'Run Code'}
                            </button>
                            <button type="button" onClick={() => setFs(f => Math.max(11, f - 1))} className={btn}>A−</button>
                            <button type="button" onClick={() => setFs(f => Math.min(18, f + 1))} className={btn}>A+</button>
                            <button type="button" onClick={copy} className={btn}>
                                <i className={`fa-regular ${copied ? 'fa-circle-check text-emerald-400' : 'fa-copy'}`}></i> {copied ? (vi ? 'Đã chép' : 'Copied') : (vi ? 'Chép' : 'Copy')}
                            </button>
                            {initial !== undefined && (
                                <button
                                    type="button"
                                    onClick={() => edit(initial, 0)}
                                    className={btn}
                                >
                                    <i className="fa-solid fa-rotate-left"></i> {vi ? 'Đặt lại' : 'Reset'}
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-3 px-3 py-1 bg-slate-900/60 border-b border-slate-800/80 text-[10px] font-mono-code">
                        <span className="text-slate-400">{vi ? 'Bảng màu:' : 'Syntax:'}</span>
                        <span className="c-ty">● {vi ? 'Kiểu dữ liệu' : 'Data Type'}</span>
                        <span className="c-kw">● {vi ? 'Điều khiển' : 'Control Flow'}</span>
                        <span className="c-stl">● {vi ? 'STL / Luồng' : 'STL / Stream'}</span>
                        <span className="c-mem">● {vi ? 'Bộ nhớ' : 'Memory'}</span>
                        <span className="c-fn">● {vi ? 'Hàm' : 'Function'}</span>
                    </div>

                    {showStdin && (
                        <div className="bg-slate-900/90 border-b border-slate-800 p-2.5">
                            <div className="text-[10px] font-bold text-slate-300 uppercase mb-1">
                                {vi ? 'Dữ liệu đầu vào (Custom Stdin):' : 'Custom Standard Input (stdin):'}
                            </div>
                            <textarea
                                rows="2"
                                value={customInput}
                                onChange={e => setCustomInput(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono-code text-slate-200 focus:outline-none"
                            ></textarea>
                        </div>
                    )}

                    <div className="flex relative" style={{ height: 290, minHeight: 190, resize: 'vertical', overflow: 'hidden' }}>
                        <div
                            ref={gut}
                            className="w-12 shrink-0 bg-slate-900/80 border-r border-slate-800 text-right text-slate-600 select-none overflow-hidden font-mono-code"
                            style={{ fontSize: fs, padding: '12px 8px 12px 0', lineHeight: '22px' }}
                        >
                            {Array.from({ length: Math.max(nLines, 10) }, (_, i) => (
                                <div key={i} className={i + 1 === cur.ln ? 'text-rose-400 font-bold' : ''} style={{ height: '22px' }}>
                                    {i + 1}
                                </div>
                            ))}
                        </div>
                        <div className="relative flex-1 min-w-0 bg-slate-950">
                            <pre
                                ref={preRef}
                                aria-hidden="true"
                                className="ide-layer ide-pre-sync absolute inset-0 w-full h-full pointer-events-none select-none overflow-auto text-slate-200"
                                style={{ fontSize: fs }}
                                dangerouslySetInnerHTML={{ __html: highlightCpp(code) }}
                            ></pre>

                            <textarea
                                ref={ta}
                                value={code}
                                wrap="off"
                                spellCheck="false"
                                autoCapitalize="off"
                                autoComplete="off"
                                onChange={e => onChange(e.target.value)}
                                onKeyDown={onKey}
                                onScroll={sync}
                                onKeyUp={upd}
                                onClick={upd}
                                onSelect={upd}
                                placeholder={placeholder || (vi ? '// Gõ code C++ tại đây...' : '// Type C++ code here...')}
                                className="ide-layer absolute inset-0 w-full h-full bg-transparent text-transparent focus:outline-none resize-none selection:bg-indigo-500/35"
                                style={{ fontSize: fs, overflow: 'auto', caretColor: 'var(--text-main)' }}
                            ></textarea>

                            {suggestions.length > 0 && (
                                <div className="absolute z-30 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden bottom-3 right-3 w-64">
                                    <div className="bg-slate-950 px-3 py-1.5 text-[10px] font-bold text-slate-300 border-b border-slate-800 flex justify-between items-center">
                                        <span><i className="fa-solid fa-wand-magic-sparkles mr-1"></i>IntelliSense C++</span>
                                        <span className="text-slate-500">↑↓ · Tab/Enter</span>
                                    </div>
                                    <div className="max-h-44 overflow-y-auto">
                                        {suggestions.map((sug, sIdx) => {
                                            const badge = CAT_BADGE[sug.cat] || CAT_BADGE.stl;
                                            return (
                                                <div
                                                    key={sug.word}
                                                    onClick={() => insertKeyword(sug)}
                                                    className={`px-3 py-1.5 text-xs font-mono-code cursor-pointer flex items-center justify-between ${
                                                        sIdx === activeSuggestionIndex ? 'bg-rose-600 text-white' : 'text-slate-200 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    <span>{sug.word}</span>
                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded border ${sIdx === activeSuggestionIndex ? 'border-white/40 text-white' : badge.cls}`}>
                                                        {badge.label}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {runOutput !== null && (
                        <div className="bg-slate-900 border-t border-slate-800 p-3.5 text-xs font-mono-code relative space-y-2">
                            <div className="flex flex-wrap justify-between items-center gap-2 text-[10px] font-bold uppercase">
                                <div className="flex items-center gap-2">
                                    <span className={runOutput.status === 'ok' ? 'text-emerald-400' : 'text-rose-400'}>
                                        <i className={`fa-solid ${runOutput.status === 'ok' ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                        {runOutput.status === 'ok' ? (vi ? 'Biên dịch & Chạy Thành Công' : 'Compiled & Executed') : (vi ? 'Lỗi Biên Dịch' : 'Compilation Failed')}
                                    </span>
                                    {runOutput.time && (
                                        <span className="px-2 py-0.5 rounded bg-slate-950 text-slate-300 border border-slate-800">
                                            ⏱ {runOutput.time} ms · 💾 {runOutput.mem} KB
                                        </span>
                                    )}
                                </div>
                                <button onClick={() => setRunOutput(null)} className="text-slate-400 hover:text-white">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <pre className={`whitespace-pre-wrap p-2.5 rounded-lg bg-slate-950 border border-slate-800 ${runOutput.status === 'ok' ? 'text-emerald-300' : 'text-rose-300'}`}>
                                {runOutput.text}
                            </pre>
                        </div>
                    )}

                    <div className="flex flex-wrap justify-between gap-2 px-3 py-1.5 bg-slate-900 border-t border-slate-800 text-[10px] text-slate-400 font-mono-code">
                        <span>Ln {cur.ln}, Col {cur.col} · {nLines} {vi ? 'dòng' : 'lines'} · UTF-8</span>
                        <span>{vi ? 'Con trỏ đồng bộ 100% · Tab = 4 · Ctrl+/ chú thích' : 'Zero-Drift Cursor · Tab = 4 · Ctrl+/ comment'}</span>
                    </div>
                </div>
            );
        };

        /* ==================== 2. 10 RANK TIERS ==================== */
        const TIERS = [
            { vi: 'Giấy',      en: 'Paper',       min: 0,    icon: 'fa-note-sticky',         c: '#94a3b8' },
            { vi: 'Sắt',       en: 'Iron',        min: 100,  icon: 'fa-shield',              c: '#78716c' },
            { vi: 'Nhôm',      en: 'Aluminum',    min: 250,  icon: 'fa-layer-group',         c: '#cbd5e1' },
            { vi: 'Đồng',      en: 'Bronze',      min: 450,  icon: 'fa-shield',              c: '#d97706' },
            { vi: 'Bạc',       en: 'Silver',      min: 700,  icon: 'fa-shield-halved',       c: '#64748b' },
            { vi: 'Vàng',      en: 'Gold',        min: 1050, icon: 'fa-crown',               c: '#eab308' },
            { vi: 'Bạch Kim',  en: 'Platinum',    min: 1500, icon: 'fa-gem',                 c: '#0284c7' },
            { vi: 'Kim Cương', en: 'Diamond',     min: 2100, icon: 'fa-diamond',             c: '#4f46e5' },
            { vi: 'Tinh Anh',  en: 'Elite',       min: 2800, icon: 'fa-medal',               c: '#9333ea' },
            { vi: 'Hóa Thần',  en: 'Transcendent',min: 3800, icon: 'fa-wand-magic-sparkles', c: '#e11d48' }
        ];

        const PHASE_XP = { 1: 250, 2: 400, 3: 600, 4: 900 };

        function getTierInfo(xp) {
            let idx = 0;
            TIERS.forEach((t, i) => { if (xp >= t.min) idx = i; });
            const nxt = TIERS[idx + 1], cur = TIERS[idx];
            if (!nxt) return { idx, tier: cur, next: null, div: 1, pct: 100 };
            const span = nxt.min - cur.min, frac = Math.max(0, Math.min(1, (xp - cur.min) / span));
            return { idx, tier: cur, next: nxt.min, div: 3 - Math.min(2, Math.floor(frac * 3)), pct: Math.floor(frac * 100) };
        }

        const rankLabel = (ti, vi) => (vi ? 'Hạng ' + ti.tier.vi : ti.tier.en + ' Rank') + (ti.next ? ' ' + ['', 'I', 'II', 'III'][ti.div] : ' MAX');
        const tx = (o, k, vi) => (vi ? (o[k + 'Vi'] ?? o[k]) : (o[k + 'En'] ?? o[k]));

        /* ==================== 3. LỘ TRÌNH 4 PHASE (MỖI PHASE 4 CHƯƠNG ĐÚNG ĐỊNH HƯỚNG 1 NĂM FREELANCER) ==================== */
        const DEFAULT_MIDTERM_MCQS = Array.from({ length: 20 }, (_, idx) => ({
            id: `mcq_${idx + 1}`,
            question: `Câu hỏi trắc nghiệm cốt lõi #${idx + 1}: Đâu là phát biểu chuẩn xác trong C++ hiện đại?`,
            questionEn: `Core Assessment Question #${idx + 1}: Which statement is accurate in modern C++?`,
            options: [
                "Luôn kiểm tra biên bộ nhớ, độ phức tạp O(N log N) và giải phóng con trỏ hợp lệ",
                "Truy cập ngoài vùng nhớ mảng giúp tăng tốc độ vòng lặp",
                "Không cần giải phóng bộ nhớ cấp phát trên Heap",
                "So sánh trực tiếp 2 chuỗi C-string bằng toán tử =="
            ],
            optionsEn: [
                "Always validate memory bounds, O(N log N) complexity, and free heap pointers safely",
                "Out-of-bounds array access speeds up loops",
                "Heap memory never needs to be deallocated",
                "Compare two C-strings directly using the == operator"
            ],
            correct: 0
        }));

        const ROADMAP_RANKS = [
            {
                phase: 1,
                rankTitle: "Phase 1: Core C++ & Memory Foundations",
                rankTitleVi: "Giai Đoạn 1: Nền Tảng C++ & Quản Lý Bộ Nhớ",
                examTimeLimitMinutes: 45,
                title: "Phase 1: C++ Core, Pointers & Algorithmic Thinking",
                titleVi: "Giai Đoạn 1: C++ Cốt Lõi, Con Trỏ & Tư Duy Thuật Toán",
                timeline: "Tháng 1 - Tháng 3",
                timelineEn: "Month 1 - Month 3",
                icon: "fa-terminal",

        function ArenaTab({ vi, solved, totalXP, onAward, onPeek, leaderboardEntries, currentUserEmail, isAdmin, onAdminDeleteStudent }) {

                const r = runChecks(codes[p.id] !== undefined ? codes[p.id] : p.init, p.ck, p.init);

                const peeked = sol[p.id] || (prev && prev.peek);
                let gain = 0;

                setRes(s => ({ ...s, [p.id]: { ...r, gain, peeked } }));
                if (r.score >= 70) onAward(p.id, r.score, gain, p.t[vi ? 0 : 1], peeked);
            };

            const showSol = p => {
                setSol(s => ({ ...s, [p.id]: !s[p.id] }));
                onPeek(p.id);

            const list = problemPool.filter(p => !flt || p.d === flt);

            const val = (rawInput || '').trim().toLowerCase();
            if (!val) {
                return { valid: false, msg: vi ? 'Vui lòng nhập địa chỉ Email hoặc Apple ID!' : 'Please enter an Email or Apple ID!' };
            }
            if (val === ADMIN_EMAIL) {
                return { valid: true };
            }
            const basicEmailRegex = /^[a-z0-9]+([._%+-]?[a-z0-9]+)*@[a-z0-9-]+(\.[a-z0-9-]+)+$/;
            if (!basicEmailRegex.test(val)) {
                return {
                    valid: false,
                    msg: vi
                        ? 'Định dạng không hợp lệ! Vui lòng dùng Email hoặc Apple ID thật (ví dụ: tenban@gmail.com hoặc tenban@icloud.com).'
                        : 'Invalid format! Please use a real Email or Apple ID (e.g., yourname@gmail.com or yourname@icloud.com).'
                };
            }
            const [localPart, domainPart] = val.split('@');
            if (!localPart || localPart.length < 3 || /^([a-z0-9])\1+$/.test(localPart)) {
                return {
                    valid: false,
                    msg: vi
                        ? 'Tên tài khoản trước @ quá ngắn hoặc có dấu hiệu nhập bừa! Hãy dùng Email/Apple ID thật.'
                        : 'Username before @ appears invalid or random! Please enter a real Email/Apple ID.'
                };
            }
            const isEduOrOrgDomain = /\.(edu\.vn|edu|ac\.vn|gov\.vn|com\.vn)$/.test(domainPart);
            if (method === 'apple') {
                if (!ALLOWED_APPLE_ID_DOMAINS.includes(domainPart) && !isEduOrOrgDomain) {
                    return {
                        valid: false,
                        msg: vi
                            ? 'Apple ID phải sử dụng tên miền hợp lệ (@icloud.com, @me.com, @mac.com hoặc @gmail.com/@outlook.com đã đăng ký Apple)!'
                            : 'Apple ID must use a verified domain (@icloud.com, @me.com, @mac.com, or registered @gmail.com/@outlook.com)!'
                    };
                }
            } else {
                if (!ALLOWED_REAL_EMAIL_DOMAINS.includes(domainPart) && !isEduOrOrgDomain) {
                    return {
                        valid: false,
                        msg: vi
                            ? 'Chỉ chấp nhận nhà cung cấp Email thật (@gmail.com, @outlook.com, @icloud.com, @yahoo.com, @*.edu.vn...)!'
                            : 'Only real Email providers are accepted (@gmail.com, @outlook.com, @icloud.com, @yahoo.com, @*.edu.vn...)!'

                }
            }
            return { valid: true };

        /* ==================== 5. MAIN APPLICATION ==================== */
        function App() {
            const [authUser, setAuthUser] = useState(() => {

            const [isCloudSyncing, setIsCloudSyncing] = useState(false);

            const [authViewMode, setAuthViewMode] = useState('login'); // 'login' | 'register' | 'forgot'
            const [loginMethod, setLoginMethod] = useState('email');
            const [loginEmail, setLoginEmail] = useState('');

            const [loginConfirmPass, setLoginConfirmPass] = useState('');
            const [loginError, setLoginError] = useState('');
            const [loginSuccessMsg, setLoginSuccessMsg] = useState('');

            const isAuthenticated = !!authUser;
            const isAdmin = isAuthenticated && authUser?.email?.toLowerCase() === ADMIN_EMAIL && authUser?.role === 'admin';
            const isAdminTyped = loginEmail.trim().toLowerCase() === ADMIN_EMAIL;

            const saveStudentDirectory = (updater) => {
                setStudentDirectory(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;

            const appendStudentActivity = (email, actionVi, actionEn, extraUpdates = {}) => {
                if (!email || email.toLowerCase() === ADMIN_EMAIL) return;

                    const existing = prev[key] || {
                        email: key,
                        name: key.split('@')[0],
                        provider: 'email',
                        online: true,
                        kicked: false,
                        currentLocationVi: 'Trang Mở Đầu',
                        currentLocationEn: 'Welcome Screen',
                        lastActive: 'Vừa xong',
                        xp: 0,
                        device: 'Web Browser',
                        history: []
                    };
                    const nextHistory = [
                        { time: nowStr, actionVi, actionEn },
                        ...(existing.history || [])
                    ].slice(0, 40);
                    return {
                        ...prev,
                        [key]: {
                            ...existing,

                            lastActive: 'Vừa xong',
                            history: nextHistory

                    };

            const saveAccountsMap = (nextMap) => {
                setRegisteredAccounts(nextMap);
                try { localStorage.setItem('coder_registered_accounts', JSON.stringify(nextMap)); } catch (e) {}
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setLoginError('');
                setLoginSuccessMsg('');
                const emailTrim = loginEmail.trim().toLowerCase();

                const checkId = validateRealAccountIdentifier(emailTrim, loginMethod, translateEnToVi);

                    setLoginError(checkId.msg);
                    return;

                    setLoginError(
                        translateEnToVi
                            ? '🚫 Tài khoản này đang bị Admin tạm khóa phiên truy cập!'

                    return;
                }

                if (authViewMode === 'register') {
                    if (emailTrim === ADMIN_EMAIL) {
                        setLoginError(translateEnToVi ? 'Email nguyentanhaihuy2008cm@gmail.com thuộc quyền sở hữu độc quyền của Admin!' : 'This email is reserved exclusively for Admin!');

                    }
                    if (registeredAccounts[emailTrim]) {
                        setLoginError(translateEnToVi ? 'Tài khoản này đã được đăng ký! Vui lòng chuyển sang Đăng nhập.' : 'Account already exists! Please switch to Sign In.');
                        return;
                    }
                    if (loginPass.length < 6 || !/[A-Za-z]/.test(loginPass) || !/\d/.test(loginPass)) {
                        setLoginError(translateEnToVi ? 'Mật khẩu phải từ 6 ký tự trở lên, bao gồm cả chữ cái và chữ số!' : 'Password must be at least 6 characters and include both letters and numbers!');

                        setLoginError(translateEnToVi ? 'Mật khẩu xác nhận không khớp!' : 'Confirm password does not match!');

                    appendStudentActivity(

                        'Đăng ký tài khoản học viên mới',

                    return;

                if (authViewMode === 'forgot') {
                    if (!registeredAccounts[emailTrim] && !studentDirectory[emailTrim]) {
                        setLoginError(translateEnToVi ? 'Không tìm thấy tài khoản này trong hệ thống! Vui lòng Tạo tài khoản mới.' : 'Account not found in system! Please register first.');
                        return;
                    }
                    if (loginPass.length < 6 || !/[A-Za-z]/.test(loginPass) || !/\d/.test(loginPass)) {
                        setLoginError(translateEnToVi ? 'Mật khẩu mới cần tối thiểu 6 ký tự (gồm cả chữ và số)!' : 'New password must be at least 6 chars with letters & numbers!');

                    return;

                if (loginPass.length < 4) {
                    setLoginError(translateEnToVi ? 'Mật khẩu không hợp lệ!' : 'Invalid password!');

                    setLoginError(translateEnToVi ? 'Mật khẩu không chính xác! Hãy thử lại hoặc bấm Quên mật khẩu.' : 'Incorrect password! Try again or use Forgot Password.');

                    role: emailTrim === ADMIN_EMAIL ? 'admin' : 'student',
                    provider: loginMethod,
                    email: emailTrim

                        `Đăng nhập vào web qua ${loginMethod === 'apple' ? 'Apple ID' : 'Email'}`,

            const handleAdminInstantLogin = () => {

            const handleAdminDeleteStudentPermanently = (targetEmail) => {

            const handleAdminUnkickStudent = (targetEmail) => {
                if (!isAdmin || !targetEmail) return;

                saveStudentDirectory(prev => {

                    return {

                        [key]: {
                            ...st,
                            kicked: false,
                            history: [
                                {
                                    time: nowStr,
                                    actionVi: `✅ Được Admin (${ADMIN_EMAIL}) mở khóa truy cập lại`,
                                    actionEn: `✅ Access restored by Admin (${ADMIN_EMAIL})`

                                ...(st.history || [])
                            ]
                        }

                pushToast(
                    translateEnToVi
                        ? `✅ Đã mở khóa cho phép ${key} truy cập lại!`
                        : `✅ Restored access for ${key}!`,
                    'xp'
                );
            };

            const [activeDomain, setActiveDomain] = useState('home'); // 'home' | 'hub_select' | 'laptrinh' | 'toan' | 'admin_students'
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);

            const [showCommandModal, setShowCommandModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [showCheatsheetModal, setShowCheatsheetModal] = useState(false);
            const [focusSoundOn, setFocusSoundOn] = useState(false);
            const audioCtxRef = useRef(null);

            const [activeTab, setActiveTab] = useState('roadmap');
            const [readingDoc, setReadingDoc] = useState(null);
            const [translateEnToVi, setTranslateEnToVi] = useState(true);
            const [isLightMode, setIsLightMode] = useState(() => {
                try { return localStorage.getItem('coder_theme_mode') === 'light'; } catch (e) { return false; }
            });

            useEffect(() => {
                const htmlEl = document.documentElement;
                const bodyEl = document.body;
                if (isLightMode) {
                    htmlEl.classList.remove('dark-theme');
                    htmlEl.classList.add('light-theme');
                    bodyEl.classList.remove('dark-theme');
                    bodyEl.classList.add('light-theme');
                    try { localStorage.setItem('coder_theme_mode', 'light'); } catch (e) {}
                } else {
                    htmlEl.classList.remove('light-theme');
                    htmlEl.classList.add('dark-theme');
                    bodyEl.classList.remove('light-theme');
                    bodyEl.classList.add('dark-theme');

                }

            useEffect(() => {

                bodyEl.classList.remove('theme-vi', 'theme-en');

                bodyEl.classList.add(translateEnToVi ? 'theme-vi' : 'theme-en');
            }, [translateEnToVi]);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setShowCommandModal(prev => !prev);
                    }
                    if (e.key === 'Escape') {
                        setShowCommandModal(false);
                        setShowCheatsheetModal(false);
                        setIsDrawerOpen(false);
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, []);

            const toggleFocusAmbience = () => {
                if (!focusSoundOn) {
                    try {
                        const Ctx = window.AudioContext || window.webkitAudioContext;
                        const ctx = new Ctx();
                        const osc1 = ctx.createOscillator();
                        const osc2 = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc1.type = 'sine';
                        osc2.type = 'triangle';
                        osc1.frequency.setValueAtTime(174, ctx.currentTime);
                        osc2.frequency.setValueAtTime(261.63, ctx.currentTime);
                        gain.gain.setValueAtTime(0.025, ctx.currentTime);
                        osc1.connect(gain);
                        osc2.connect(gain);
                        gain.connect(ctx.destination);
                        osc1.start();
                        osc2.start();
                        audioCtxRef.current = ctx;
                        setFocusSoundOn(true);
                    } catch (e) {}
                } else {
                    if (audioCtxRef.current) {
                        audioCtxRef.current.close().catch(() => {});
                        audioCtxRef.current = null;
                    }
                    setFocusSoundOn(false);
                }
            };

            const handleExportProgress = () => {

                    xp: totalXP,
                    unlockedPhase,
                    solved,
                    notes: userNotes,
                    customChapterDocs,
                    exportedAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `coder_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                pushToast(translateEnToVi ? '💾 Đã tải xuống file sao lưu tiến độ!' : '💾 Progress backup downloaded!', 'xp');
            };

            const handlePushToCloudGist = async () => {
                if (!isAdmin) return;
                if (!cloudGithubToken.trim()) {
                    pushToast(translateEnToVi ? '⚠️ Vui lòng nhập GitHub Token (quyền gist) để đẩy dữ liệu lên Cloud!' : '⚠️ Please enter a GitHub Token (gist scope) to push to Cloud!', 'rank');
                    return;
                }
                setIsCloudSyncing(true);
                try {
                    const payload = {
                        customChapterDocs,
                        studentDirectory,
                        permanentlyDeletedEmails,
                        updatedAt: new Date().toISOString()
                    };
                    const bodyObj = {
                        description: "Coder Dang Len - Live Course Cloud Sync Data",
                        public: true,
                        files: {
                            "coder_live_data.json": {
                                content: JSON.stringify(payload, null, 2)
                            }
                        }
                    };
                    const url = cloudGistId.trim()
                        ? `https://api.github.com/gists/${cloudGistId.trim()}`
                        : `https://api.github.com/gists`;
                    const res = await fetch(url, {
                        method: cloudGistId.trim() ? 'PATCH' : 'POST',
                        headers: {
                            'Accept': 'application/vnd.github+json',
                            'Authorization': `Bearer ${cloudGithubToken.trim()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(bodyObj)
                    });
                    if (!res.ok) throw new Error('Cloud sync failed');
                    const data = await res.json();
                    if (data.id) {
                        setCloudGistId(data.id);
                        localStorage.setItem('coder_cloud_gist_id', data.id);
                    }
                    localStorage.setItem('coder_cloud_gh_token', cloudGithubToken.trim());
                    pushToast(translateEnToVi ? '☁️ Đã xuất bản dữ liệu trực tiếp lên Cloud thành công!' : '☁️ Live data published to Cloud Gist!', 'xp');
                } catch (err) {
                    pushToast(translateEnToVi ? '❌ Lỗi đồng bộ Cloud! Kiểm tra lại Token hoặc Gist ID.' : '❌ Cloud sync error! Check Token or Gist ID.', 'rank');
                } finally {
                    setIsCloudSyncing(false);
                }
            };

            const handlePullFromCloudGist = async (silent = false) => {
                if (!cloudGistId.trim()) {
                    if (!silent) pushToast(translateEnToVi ? '⚠️ Chưa có mã Gist ID để tải dữ liệu!' : '⚠️ Missing Gist ID!', 'rank');
                    return;
                }
                setIsCloudSyncing(true);
                try {
                    const res = await fetch(`https://api.github.com/gists/${cloudGistId.trim()}`);
                    if (!res.ok) throw new Error('Cannot fetch Gist');
                    const data = await res.json();
                    const rawContent = data.files?.["coder_live_data.json"]?.content;
                    if (rawContent) {
                        const parsed = JSON.parse(rawContent);
                        if (parsed.customChapterDocs) setCustomChapterDocs(parsed.customChapterDocs);
                        if (parsed.studentDirectory) saveStudentDirectory(parsed.studentDirectory);
                        if (parsed.permanentlyDeletedEmails) {
                            setPermanentlyDeletedEmails(parsed.permanentlyDeletedEmails);
                            localStorage.setItem('coder_deleted_emails', JSON.stringify(parsed.permanentlyDeletedEmails));
                        }
                        localStorage.setItem('coder_cloud_gist_id', cloudGistId.trim());
                        if (!silent) pushToast(translateEnToVi ? '🔄 Đã đồng bộ tài liệu & BXH mới nhất từ Cloud!' : '🔄 Synced latest docs & leaderboard from Cloud!', 'xp');
                    }
                } catch (err) {
                    if (!silent) pushToast(translateEnToVi ? '⚠️ Không thể tải từ Gist ID này!' : '⚠️ Failed to load from Gist ID!', 'rank');
                } finally {
                    setIsCloudSyncing(false);
                }

            const [userNotes, setUserNotes] = useState(() => localStorage.getItem('coder_user_notes') || '');
            const [coderProfile, setCoderProfile] = useState(() => {

                        : { name: 'Coder Đang Lên', avatar: 'dev1', customAvatar: '', bio: 'C++ & Algorithm Enthusiast', github: '', targetRank: 'Hóa Thần' };

            const scanAndTranslateWithAI = async (rawText, defaultTitleVi = '', defaultTitleEn = '') => {
                if (!rawText || !rawText.trim()) return null;
                setIsScanningDoc(true);
                await new Promise(r => setTimeout(r, 450));

                const cleaned = rawText.replace(/\r\n/g, '\n').trim();
                const codeBlocks = [];
                const codeRe = /```(?:cpp|c\+\+|c)?\s*([\s\S]*?)```/gi;
                let m;
                while ((m = codeRe.exec(cleaned)) !== null) {
                    if (m[1] && m[1].trim()) codeBlocks.push(m[1].trim());
                }

                const textWithoutFences = cleaned.replace(/```[\s\S]*?```/g, '').trim();
                const allLines = textWithoutFences.split('\n').map(l => l.trim()).filter(Boolean);

                if (codeBlocks.length === 0) {
                    const codeLikeLines = allLines.filter(l =>
                        /^(#include|using\s+namespace|int\s+main|void\s+\w+|int\s+\w+|double\s+\w+|bool\s+\w+|struct\s+\w+|class\s+\w+|for\s*\(|while\s*\(|if\s*\(|return\s+|std::|cout\s*<<|cin\s*>>)/.test(l) ||
                        /[{};]$/.test(l)
                    );
                    if (codeLikeLines.length >= 2) {
                        codeBlocks.push(codeLikeLines.join('\n'));
                    }
                }

                const proseLines = allLines.filter(l =>
                    !/^(#include|using\s+namespace)/.test(l) &&
                    !/^[{}]+$/.test(l)
                );

                const bulletPointsVi = (proseLines.length > 0 ? proseLines : allLines)
                    .map(l => l.replace(/^[-*•\d.)+]+\s*/, '').trim())
                    .filter(l => l.length > 8)
                    .slice(0, 8);

                const summaryVi = bulletPointsVi.length > 0
                    ? bulletPointsVi.slice(0, 2).join(' — ').slice(0, 240)
                    : cleaned.slice(0, 200);

                const dictViToEn = [
                    [/kiểu dữ liệu/gi, 'data types'],
                    [/ép kiểu/gi, 'type casting'],
                    [/bộ đệm/gi, 'stream buffer'],
                    [/rẽ nhánh/gi, 'branching logic'],
                    [/vòng lặp/gi, 'loops'],
                    [/hàm/gi, 'functions'],
                    [/tham chiếu/gi, 'pass-by-reference'],
                    [/đệ quy/gi, 'recursion'],
                    [/mảng/gi, 'arrays'],
                    [/chuỗi/gi, 'strings'],
                    [/con trỏ/gi, 'pointers'],
                    [/cấp phát động/gi, 'dynamic memory allocation'],
                    [/bộ nhớ/gi, 'memory'],
                    [/rò rỉ bộ nhớ/gi, 'memory leak'],
                    [/độ phức tạp/gi, 'time complexity'],
                    [/tối ưu/gi, 'optimization'],
                    [/thuật toán/gi, 'algorithm'],
                    [/cấu trúc dữ liệu/gi, 'data structures']
                ];

                const translateLineToEn = (line) => {
                    if (!/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(line)) {
                        return line;
                    }
                    let translated = line;
                    dictViToEn.forEach(([re, enWord]) => {
                        translated = translated.replace(re, enWord);
                    });
                    return `[EN Summary] ${translated}`;
                };

                const bulletPointsEn = bulletPointsVi.map(translateLineToEn);
                const summaryEn = bulletPointsEn.length > 0
                    ? bulletPointsEn.slice(0, 2).join(' — ').slice(0, 240)
                    : `[EN Summary] ${summaryVi}`;

                const extractedCode = codeBlocks.length > 0
                    ? codeBlocks.join('\n\n')
                    : (slotDraftCode || '// Sample C++ implementation\n#include <iostream>\nusing namespace std;\n\nint main() {\n    return 0;\n}');

                const result = {
                    titleVi: defaultTitleVi || slotDraftTitleVi,
                    titleEn: defaultTitleEn || slotDraftTitleEn,
                    summaryVi,
                    summaryEn,
                    contentPointsVi: bulletPointsVi.length > 0 ? bulletPointsVi : [summaryVi],
                    contentPointsEn: bulletPointsEn.length > 0 ? bulletPointsEn : [summaryEn],
                    codeExample: extractedCode
                };

                setSlotDraftSummaryVi(result.summaryVi);
                setSlotDraftSummaryEn(result.summaryEn);
                setSlotDraftContentVi(result.contentPointsVi.join('\n'));
                setSlotDraftContentEn(result.contentPointsEn.join('\n'));
                setSlotDraftCode(result.codeExample);
                setIsScanningDoc(false);
                return result;
            };

                        }
